[package]
name = "kpm-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A GTK 2 frontend for the Kindle Package Manager"

[dependencies]
kindle-gtk = { path = "kindle-gtk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "kpm-ui"
path = "src/main.rs"
test = false
bench = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
